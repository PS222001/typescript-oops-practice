<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bank Account System</title>
</head>

<body>

    <h1>Bank Account System</h1>

    <h3>Deposit Money</h3>

    <input
        type="number"
        id="depositAmount"
        placeholder="Enter deposit amount"
    >

    <button onclick="depositMoney()">
        Deposit
    </button>


    <h3>Withdraw Money</h3>

    <input
        type="number"
        id="withdrawAmount"
        placeholder="Enter withdrawal amount"
    >

    <button onclick="withdrawMoney()">
        Withdraw
    </button>


    <h3>Account Details</h3>

    <button onclick="showBalance()">
        Display Balance
    </button>


    <p id="result"></p>


    <script src="banking.js"></script>

</body>

</html>
