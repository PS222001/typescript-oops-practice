<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result System</title>
</head>

<body>

    <h1>Student Result System</h1>

    <h3>Student Name</h3>

    <input
        type="text"
        id="studentName"
        placeholder="Enter student name"
    >


    <h3>Enter Marks</h3>

    <input type="number" id="mark1" placeholder="Enter Mark of Subject 1"><br><br>

    <input type="number" id="mark2" placeholder="Enter Mark of Subject 2"><br><br>

    <input type="number" id="mark3" placeholder="Enter Mark of Subject 3"><br><br>

    <input type="number" id="mark4" placeholder="Enter Mark of Subject 4"><br><br>

    <input type="number" id="mark5" placeholder="Enter Mark of Subject 5"><br><br>


    <button onclick="calculateResult()">
        Calculate Result
    </button>


    <h3>Student Result</h3>

    <p id="result"></p>


    <script src="student.js"></script>

</body>

</html>
