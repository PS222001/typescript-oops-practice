<!DOCTYPE html>
<html>

<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="University Fees">
    <title>University Course System</title>
</head>

<body>

    <h1>University Course System</h1>

    <label>Student ID:</label>
    <input type="number" id="studentId">
    <br><br>

    <label>Name:</label>
    <input type="text" id="name">
    <br><br>

    <label>Email:</label>
    <input type="email" id="email">
    <br><br>

    <label>Base Fees:</label>
    <input type="number" id="baseFees">
    <br><br>

    <label>Student Type:</label>

    <select id="studentType">
        <option value="">-- Select Type --</option>
        <option value="UG">UG Student</option>
        <option value="PG">PG Student</option>
    </select>

    <br><br>

    <button onclick="calculateStudentFee()">
        Calculate Fees
    </button>

    <p id="result"></p>

    <script src="university.js"></script>

</body>

</html>
